name: frontend-ci

on:
  push:
    branches: ["main"]
    paths: ["frontend/**"]
  pull_request:
    branches: ["main"]
    paths: ["frontend/**"]

jobs:
  style:
    name: Frontend Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run clean install
        run: npm ci

      - name: Run npm linter
        run: npm run lint
