services:
  api:
    image: ghcr.io/jorgelr0610/closelinkit-api:${IMAGE_TAG:-latest}
    environment:
      DB_URL: "${DB_URL}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      BASE_URL: "${BASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      COOKIE_SECURE: "${COOKIE_SECURE}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
    restart: unless-stopped
    ports:
      - "8080:8080"