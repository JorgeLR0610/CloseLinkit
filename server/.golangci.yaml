version: "2"

linters:
  default: standard
  enable:
    - gosec
    - errcheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors — errcheck is more precise
  exclusions:
    rules:
      - linters: [gosec]
        path: _test\.go
        
formatters:
  enable:
    - gofmt